[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-commit-texter"
version = "0.1.0"
description = "Optional prepare-commit-msg hook that drafts Conventional Commits placeholders"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/git_commit_texter"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["git_commit_texter"]
mypy_path = "src"
